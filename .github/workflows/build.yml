name: build

# CI for the MC 1.8.9 → JDK25/LWJGL3 port. Works on private repos
# (GitHub-hosted runners include free minutes for private repositories).
on:
  # Auto-triggers on every branch: Maven's reactor discovers modules from each
  # branch's own pom.xml (main = client+shim; mcp-core adds core/board), so the
  # same workflow adapts per branch with no special-casing. Manual dispatch stays.
  push:
    branches: [ main, mcp-core, rank1-encryption-test ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests, reactor-wide. This runs whatever modules the branch's pom
      # declares: on main = lwjgl2-shim + client; on mcp-core = + core (253) +
      # board (172). This is the primary regression net — a failing unit test
      # fails the build. (Live/native ITs self-skip; see the reactor package step.)
      - name: Unit tests (reactor)
        run: ./mvnw -B -ntp test

      # Reactor build: compiles every module and produces the shaded fat jars.
      # Tests were already run above, so skip them here to avoid double work.
      - name: Build (reactor package)
        run: ./mvnw -B -ntp clean package -DskipTests

      # Verify the publishable artifacts. shim + client exist on every branch;
      # the core fat agent jar only exists on branches whose pom includes core
      # (mcp-core), so assert it conditionally rather than failing on main.
      - name: Verify artifacts
        run: |
          test -f lwjgl2-shim/target/lwjgl2-shim-*.jar
          test -f client/target/MCP-1.8.9.jar
          echo "shim + client artifacts present"
          if [ -d core ]; then
            ls core/target/core-*.jar >/dev/null 2>&1 || { echo "core module present but no core-*.jar built" >&2; exit 1; }
            echo "core fat agent jar present"
          fi

      # Failsafe smoke tests. On CI there are no game assets, so the runtime
      # smoke IT self-skips via Assume (assets missing) — the phase still runs
      # and guards the wiring. Enable with -Dsmoke.skip=false locally (with
      # assets present) to actually drive the client into a world.
      - name: Smoke tests (skip runtime if no assets)
        run: ./mvnw -B -ntp verify -Dsmoke.skip=false

      - name: Upload shim library
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl2-shim
          path: lwjgl2-shim/target/lwjgl2-shim-*.jar

      - name: Upload client fat jar
        uses: actions/upload-artifact@v4
        with:
          name: MCP-client
          path: client/target/MCP-1.8.9.jar
